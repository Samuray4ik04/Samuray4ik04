<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="Samuray43k — лютый вайбкодер">
  <defs>
    <radialGradient id="glowLeft"><stop offset="0" stop-color="#394632"/><stop offset="1" stop-color="#394632" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowRight"><stop offset="0" stop-color="#285b49"/><stop offset="1" stop-color="#285b49" stop-opacity="0"/></radialGradient>
    <clipPath id="typeClip">
      <rect x="62" y="228" width="0" height="34">
        <animate attributeName="width" from="0" to="342" dur="1.6s" begin="0.5s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="957" height="337" rx="24" fill="#122c27" stroke="#3b5447" stroke-width="3"/>
  <circle cx="690" cy="120" r="230" fill="url(#glowLeft)" opacity="0.8"/>
  <circle cx="900" cy="200" r="210" fill="url(#glowRight)" opacity="0.8"/>
  <ellipse cx="770" cy="175" rx="190" ry="120" fill="none" stroke="#3b5447" transform="rotate(-20 770 175)"/>

  <text x="64" y="72" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="13"
    letter-spacing="3" fill="#b1c7b8">● PERSONAL SPACE / 043</text>

  <text x="60" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="84"
    font-weight="600" letter-spacing="-2" fill="#edf3df">Samuray<tspan font-style="italic"
    fill="#b2dfbe">43k</tspan><tspan font-size="46" dy="-30" fill="#d5bc87"> ✳</tspan></text>

  <text x="64" y="196" font-family="Georgia, serif" font-style="italic" font-size="21"
    fill="#b1c7b8">немного кода, немного аниме</text>

  <g font-family="ui-monospace, Consolas, Menlo, monospace" font-size="19">
    <text x="64" y="252" clip-path="url(#typeClip)"><tspan fill="#b2dfbe">$ whoami</tspan><tspan
      fill="#edf3df" xml:space="preserve">  →  лютый вайбкодер</tspan></text>
    <rect x="394" y="235" width="10" height="22" fill="#d5bc87">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="64" y="304" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="12"
    letter-spacing="2.5" fill="#b1c7b8">a little sunshine. a little spirit.</text>

  <g transform="translate(690 150) rotate(-8)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0 0; 0 -6; 0 0" dur="6s" begin="0s" repeatCount="indefinite"/>
    <linearGradient id="archHoney" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e6240"/><stop offset="1" stop-color="#a88d52"/>
    </linearGradient>
    <path d="M-72,95 V-40 A72,72 0 0 1 72,-40 V95 Q72,105 62,105 H-62 Q-72,105 -72,95 Z"
      fill="#1c3830" stroke="#3b5447"/>
    <path d="M-64,62 V-38 A64,64 0 0 1 64,-38 V62 Z" fill="url(#archHoney)"/>
    <text x="40" y="-30" font-family="serif" font-size="30" fill="#edf3df" fill-opacity="0.6"
      writing-mode="tb" letter-spacing="2">真昼</text>
    <text x="0" y="22" text-anchor="middle" font-size="42" fill="#edf3df" fill-opacity="0.85">☀</text>
    <text x="-60" y="89" font-family="Georgia, serif" font-size="16" font-style="italic"
      font-weight="600" fill="#edf3df">Mahiru</text>
  </g>

  <g transform="translate(840 178) rotate(8)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0 0; 0 -6; 0 0" dur="6s" begin="-3s" repeatCount="indefinite"/>
    <linearGradient id="archMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c5a4a"/><stop offset="1" stop-color="#4d8f76"/>
    </linearGradient>
    <path d="M-72,95 V-40 A72,72 0 0 1 72,-40 V95 Q72,105 62,105 H-62 Q-72,105 -72,95 Z"
      fill="#1c3830" stroke="#3b5447"/>
    <path d="M-64,62 V-38 A64,64 0 0 1 64,-38 V62 Z" fill="url(#archMint)"/>
    <text x="40" y="-30" font-family="serif" font-size="30" fill="#edf3df" fill-opacity="0.6"
      writing-mode="tb" letter-spacing="2">藿藿</text>
    <text x="0" y="22" text-anchor="middle" font-size="42" fill="#edf3df" fill-opacity="0.85">✧</text>
    <text x="-60" y="89" font-family="Georgia, serif" font-size="16" font-style="italic"
      font-weight="600" fill="#edf3df">Huohuo</text>
  </g>

  <text x="560" y="58" font-size="30" fill="#b2dfbe">✦<animate attributeName="opacity"
    values="1;0.25;1" dur="3.2s" begin="0s" repeatCount="indefinite"/></text>
  <text x="905" y="300" font-size="22" fill="#b2dfbe">✧<animate attributeName="opacity"
    values="1;0.25;1" dur="3.2s" begin="1.3s" repeatCount="indefinite"/></text>
  <text x="470" y="296" font-size="18" fill="#b2dfbe">✦<animate attributeName="opacity"
    values="1;0.25;1" dur="3.2s" begin="2.1s" repeatCount="indefinite"/></text>
</svg>
